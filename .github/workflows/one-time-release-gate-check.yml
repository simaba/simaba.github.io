name: One-time approved-release gate verification
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  gate:
    name: verify-human-signoff-and-png-baselines
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7, Node 24
        with:
          persist-credentials: false
      - name: Verify actual approved source digest and exact six PNG hashes
        run: python3 scripts/launch_gate.py
