name: Portfolio verification and gated Pages publication

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, 'work/technical-editorial-v04-review']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portfolio-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: static-and-chromium-review
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7, Node 24
        with:
          persist-credentials: false
      - name: Fetch verified public repository data only on trusted main
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/sync.py
      - name: Verify structured content, generated website, privacy and editorial design
        run: |
          python3 scripts/verify.py
          python3 -m unittest discover -s tests -v
          node --check assets/app.js
          test -s dist/index.html
          test -f dist/.nojekyll
      - name: Install pinned browser tooling
        run: |
          python3 -m venv .venv
          .venv/bin/pip install playwright==1.57.0 pillow==12.0.0
          .venv/bin/python -m playwright install --with-deps chromium
      - name: Browser behavior, responsive layout and screenshot evidence
        run: .venv/bin/python scripts/browser_review.py
      - name: Require review screenshots
        run: |
          for name in desktop tablet mobile small-mobile; do
            test -s ".qa/$name.png"
            test -s ".qa/$name-first-fold.png"
          done
          test -s .qa/desktop-dark.png
          test -s .qa/mobile-dark.png
          test -s .qa/review-manifest.json
      - name: Compare screenshots against approved visual baselines
        run: .venv/bin/python scripts/compare_visual.py
      - name: Upload short-lived screenshot evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7, Node 24
        with:
          name: portfolio-visual-review-${{ github.run_id }}
          path: .qa/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 1
      - name: Preserve exact verified site (trusted main only)
        if: success() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7, Node 24
        with:
          name: verified-site-${{ github.run_id }}
          path: dist/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  publish:
    name: gated-pages-deployment
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [verify]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout exactly the reviewed commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7, Node 24
        with:
          persist-credentials: false
      - name: Check signed-off authored source and baseline hashes
        run: python3 scripts/launch_gate.py
      - name: Download exact verified artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8, Node 24
        with:
          name: verified-site-${{ github.run_id }}
          path: dist/
      - name: Confirm artifact includes the full site
        run: |
          test -s dist/index.html
          test -s dist/assets/styles.css
          test -s dist/assets/app.js
          test -f dist/.nojekyll
      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Upload a short-lived Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: dist/
          retention-days: 1
      - name: Deploy tested artifact
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

  # Temporary branch-only transfer of six verified Chromium PNGs. Delete this
  # job and the branch push trigger before production approval / merge.
  snapshot_candidate:
    name: stage-approved-visual-baselines
    if: github.event_name == 'push' && github.ref == 'refs/heads/work/technical-editorial-v04-review'
    needs: [verify]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Checkout working review branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7, Node 24
        with:
          persist-credentials: true
      - name: Restore screenshots generated by the same verified run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8, Node 24
        with:
          name: portfolio-visual-review-${{ github.run_id }}
          path: .qa/
      - name: Stage six actual full-page baseline PNGs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tests/visual-baseline
          for name in desktop.png desktop-dark.png tablet.png mobile.png mobile-dark.png small-mobile.png; do
            test -s ".qa/$name"
            cp ".qa/$name" "tests/visual-baseline/$name"
          done
          sha256sum tests/visual-baseline/*.png
          git add tests/visual-baseline/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'review: stage six approved visual baseline candidates'
          git push origin HEAD:work/technical-editorial-v04-review
