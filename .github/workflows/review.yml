name: Portfolio verification and gated Pages publication

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portfolio-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: static-and-chromium-review
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7, Node 24
        with:
          persist-credentials: false
      - name: Fetch verified public repository data only on trusted main
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/sync.py
      - name: Checkout pinned automotive reference source for direct semantic parity
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7, Node 24
        with:
          repository: simaba/automotive-llm-eval-harness
          ref: 10e4e71313a11b93ce71b9c5750d55fdb51115a7
          path: .source-reference/automotive
          sparse-checkout: |
            src/automotive_llm_eval_harness/core.py
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Checkout pinned Agent Simulator reference source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7, Node 24
        with:
          repository: simaba/agent-simulator
          ref: 8fa1bce9994f33e428592555d35acff79663f602
          path: .source-reference/agent
          sparse-checkout: |
            src/agents.py
            src/controller.py
            src/scenarios.py
            src/evaluation.py
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Checkout pinned Program Management validators and schemas
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7, Node 24
        with:
          repository: simaba/everything-program-management
          ref: aef7e66b87ab07f38e9410cbc831274cb959fb41
          path: .source-reference/pmkit
          sparse-checkout: |
            src/pmkit/__init__.py
            src/pmkit/validators.py
            schemas/raid-row.schema.json
            schemas/decision-memo-frontmatter.schema.json
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Checkout pinned Release Validator source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7, Node 24
        with:
          repository: simaba/release-checklist
          ref: b400063973acf011cae515fa985e83aa63a8ed29
          path: .source-reference/release
          sparse-checkout: |
            src/airc/__init__.py
            src/airc/validator.py
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Verify structured content, generated website, privacy and editorial design
        env:
          AUTOMOTIVE_REFERENCE_CORE: .source-reference/automotive/src/automotive_llm_eval_harness/core.py
          AGENT_REFERENCE_SRC: .source-reference/agent/src
        run: |
          python3 scripts/verify.py
          python3 -m unittest discover -s tests -v
          node --check assets/app.js
          node --check assets/automotive-core.js
          node --check assets/pmkit-core.js
          node --check assets/simulator-core.js
          node --check assets/project-labs.js
          node --check assets/extended-labs.js
          test -s dist/index.html
          test -f dist/.nojekyll
      - name: Install pinned browser tooling
        run: |
          python3 -m venv .venv
          .venv/bin/pip install playwright==1.57.0 pillow==12.0.0 PyYAML==6.0.2 jsonschema==4.25.1
          .venv/bin/python -m playwright install --with-deps chromium
      - name: Browser behavior, responsive layout and screenshot evidence
        env:
          PMKIT_REFERENCE_ROOT: .source-reference/pmkit
          RELEASE_REFERENCE_ROOT: .source-reference/release
        run: .venv/bin/python scripts/browser_review.py
      - name: Require review screenshots
        run: |
          for name in desktop tablet mobile small-mobile; do
            test -s ".qa/$name.png"
            test -s ".qa/$name-first-fold.png"
          done
          test -s .qa/desktop-dark.png
          test -s .qa/mobile-dark.png
          test -s .qa/review-manifest.json
      - name: Compare screenshots against approved visual baselines
        run: .venv/bin/python scripts/compare_visual.py
      - name: Upload short-lived screenshot evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7, Node 24
        with:
          name: portfolio-visual-review-${{ github.run_id }}
          path: .qa/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 1
      - name: Package local interactive preview for PR review
        if: success() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7, Node 24
        with:
          name: interactive-portfolio-preview-${{ github.run_id }}
          path: dist/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1
      - name: Preserve exact verified site (trusted main only)
        if: success() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7, Node 24
        with:
          name: verified-site-${{ github.run_id }}
          path: dist/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  publish:
    name: gated-pages-deployment
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [verify]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout exactly the reviewed commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7, Node 24
        with:
          persist-credentials: false
      - name: Check signed-off authored source and baseline hashes
        run: python3 scripts/launch_gate.py
      - name: Download exact verified artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8, Node 24
        with:
          name: verified-site-${{ github.run_id }}
          path: dist/
      - name: Confirm artifact includes the full site
        run: |
          test -s dist/index.html
          test -s dist/assets/styles.css
          test -s dist/assets/app.js
          test -f dist/.nojekyll
      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Upload a short-lived Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: dist/
          retention-days: 1
      - name: Deploy tested artifact
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
